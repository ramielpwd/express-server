<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make an Account</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/guestbook">Guestbook</a>
        <a href="/space">Space</a>
        <a href="/dashboard">Dashboard</a>
    </nav>

    <h1>Make an account</h1>

    <form id="register-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="20" autocomplete="username" required>
        <small>3 to 20 letters, numbers or underscores</small>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <small>At least 8 characters</small>

        <button type="submit">Make account</button>
    </form>
    <p id="register-message" role="alert"></p>
    <p>Already have an account? <a href="/">Log in</a></p>

    <script src="/js/register.js"></script>
</body>

</html>
